name: CI

on:
  push:
    branches: [main]
  pull_request:

# No global MIX_ENV: `mix test` switches to :test itself, while
# compile/credo/docs run in :dev — same as the local pre-commit hook.
# Forcing MIX_ENV=test breaks `mix docs` (ex_doc is a dev-only dep).

jobs:
  lavash:
    name: lavash (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported (mix.exs: elixir ~> 1.18) and current dev pair.
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.19.0"
            otp: "28.1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Tests (unit + browser e2e)
        # Ubuntu runners ship Chrome; Wallabidi drives it over CDP.
        env:
          WALLABIDI_CHROME_PATH: /usr/bin/google-chrome
        run: mix test

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

  demo:
    name: demo app (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.19.0"
            otp: "28.1"
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            demo/deps
            demo/_build
          key: mix-demo-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('demo/mix.lock') }}
          restore-keys: |
            mix-demo-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Tests
        run: mix test
